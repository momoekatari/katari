        function renderMessages(charId) {
            const msgs = data.chats[charId] || [];
            if (!msgs.length) {
                chatMessages.innerHTML = `
                    <div class="msg-row system"><div class="msg system">💬 开始对话吧</div></div>
                `;
                return;
            }
            const ch = data.characters.find(c => c.id === charId);
            // 助手头像 HTML（URL 优先，否则首字符）
            const avatarHtml = (c) => c && c.avatar
                ? `<img src="${escHtml(c.avatar)}" alt="" />`
                : escHtml((c && c.name ? c.name.charAt(0) : 'AI'));
            const hasThink = (m) => !!(m.think && String(m.think).trim());

            chatMessages.innerHTML = msgs.map((m, idx) => {
                if (m.role === 'system') {
                    return `<div class="msg-row system"><div class="msg system">${escHtml(m.content)}</div></div>`;
                }
                const isUser = m.role === 'user';
                const cls = isUser ? 'user' : 'assistant';
                // 同一人连续消息：上一条非 system 且 role 相同 → 间距紧凑
                const prev = msgs[idx - 1];
                const sameSender = prev && prev.role !== 'system' && prev.role === m.role;
                const rowCls = sameSender ? `${cls} same-sender` : cls;

                // 头像：助手用角色头像，用户用固定头像
                const avInner = isUser
                    ? (data.userAvatar ? `<img src="${escHtml(data.userAvatar)}" alt="" />` : '我')
                    : avatarHtml(ch);
                const avatarDiv = `<div class="msg-avatar">${avInner}</div>`;
                // 助手有 think 时，气泡下方加提示小字
                const thinkHint = (!isUser && hasThink(m))
                    ? `<div class="think-hint" data-msg-idx="${idx}">💭 偷偷看看ta在想什么？</div>`
                    : '';
                // token 数：助手消息气泡下方极小灰字
                const tokenHint = (!isUser && m.tokens)
                    ? `<div style="font-size:10px; color:var(--ink-soft); margin-top:4px; opacity:0.6;">🪙 ${m.tokens} tokens</div>`
                    : '';
                const extraHints = thinkHint + tokenHint;

                // 流式消息：保留单个大气泡实时显示（性能 + 视觉连贯）
                if (m.streaming) {
                    return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls} streaming"><span class="typing-dots"><i></i><i></i><i></i></span></div></div></div>`;
                }

                // 语音 / 表情包：不拆分，整条渲染
                if (m.isVoice) {
                    const vcontent = `<div class="voice-label"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke-linecap="round"/><path d="M19 10v2a7 7 0 01-14 0v-2" stroke-linecap="round"/></svg>🎤 ${escHtml(m.content)}</div>`;
                    return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}">${vcontent}</div></div></div>`;
                }

                // 普通消息：按换行拆成多段，每段先解析 [表情:名字] 再生成气泡
                const charEmojiIds2 = ch ? (ch.emojis || []) : [];
                const availableEmojis2 = [
                    ...new Map([
                        ...data.emojis.filter(e => e.isGlobal),
                        ...data.emojis.filter(e => charEmojiIds2.includes(e.id))
                    ].map(e => [e.id, e])).values()
                ];
                const paras = String(m.content || '').split(/\n+/).filter(p => p.trim() !== '');
                if (!paras.length) {
                    // 防御：空内容也要有个占位气泡
                    return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}"> </div>${extraHints}</div></div>`;
                }
                // 每段先 parseEmojiSegments 拆成片段，再各自生成气泡；最后一片段挂 extraHints
                const allSegs = [];
                paras.forEach(p => {
                    const segs = parseEmojiSegments(p, availableEmojis2);
                    segs.forEach(s => allSegs.push(s));
                });
                if (!allSegs.length) {
                    return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}"> </div>${extraHints}</div></div>`;
                }
                const rows = allSegs.map((seg, i) => {
                    const last = (i === allSegs.length - 1) ? extraHints : '';
                    if (seg.type === 'emoji') {
                        const em = seg.emoji;
                        return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls} emoji-msg"><img src="${escHtml(em.url)}" alt="${escHtml(em.name)}" /></div>${last}</div></div>`;
                    }
                    return `<div class="msg-row ${rowCls}" data-msg-idx="${idx}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}">${escHtml(seg.text)}</div>${last}</div></div>`;
                }).join('');
                return rows;
            }).join('');

            // 气泡间距：同一人连续气泡之间紧凑(4px)，不同人之间宽松(16px)
            // 已通过 .same-sender 的 margin-top:-10px 实现，这里不再额外处理

            // 点击「偷偷看看ta在想什么？」提示 → 弹出思考抽屉
            chatMessages.querySelectorAll('.think-hint').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const idx = parseInt(el.getAttribute('data-msg-idx'), 10);
                    const m = msgs[idx];
                    // 防御：流式消息可能还没存 think，或索引越界，绝不报错
                    if (!m || !m.think) return;
                    const text = String(m.think).trim();
                    if (text) showThinkOverlay(m.think);
                });
            });

            // 长按消息 → 弹出编辑/删除菜单
            let __lpTimer;
            chatMessages.querySelectorAll('.msg-row .msg').forEach(el => {
                const showMenu = (e) => {
                    e.preventDefault();
                    const row = el.closest('.msg-row');
                    const idx = parseInt(row.dataset.msgIdx, 10);
                    const m = msgs[idx];
                    if (!m || m.role === 'system') return;
                    const menu = document.getElementById('longpressMenu');
                    menu.innerHTML = `
                        <div class="item" id="lpEdit">✏️ 编辑</div>
                        <div class="item delete" id="lpDelete">🗑️ 删除</div>
                    `;
                    const rect = el.getBoundingClientRect();
                    menu.style.left = Math.min(rect.left, window.innerWidth - 140) + 'px';
                    menu.style.top = Math.max(rect.top - 60, 10) + 'px';
                    menu.classList.add('open');
                    document.getElementById('lpDelete').onclick = () => {
                        msgs.splice(idx, 1);
                        saveData();
                        renderMessages(currentCharId);
                        menu.classList.remove('open');
                    };
                    document.getElementById('lpEdit').onclick = () => {
                        const newText = prompt('编辑消息内容：', m.content);
                        if (newText !== null && newText.trim() !== '') {
                            m.content = newText.trim();
                            saveData();
                            renderMessages(currentCharId);
                        }
                        menu.classList.remove('open');
                    };
                    document.addEventListener('click', function closeMenu() {
                        menu.classList.remove('open');
                        document.removeEventListener('click', closeMenu);
                    }, { once: true });
                };
                el.addEventListener('touchstart', (e) => { __lpTimer = setTimeout(() => showMenu(e), 600); }, { passive: true });
                el.addEventListener('touchend', () => clearTimeout(__lpTimer));
                el.addEventListener('touchmove', () => clearTimeout(__lpTimer), { passive: true });
                el.addEventListener('contextmenu', (e) => { e.preventDefault(); showMenu(e); });
            });

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 思考抽屉：显示 / 关闭
        function showThinkOverlay(text) {
            const overlay = document.getElementById('thinkOverlay');
            const body = document.getElementById('thinkBody');
            if (!overlay || !body) return;
            body.textContent = text;
            overlay.style.display = 'flex';
        }
        function hideThinkOverlay() {
            const overlay = document.getElementById('thinkOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        // 发送消息
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            if (!currentCharId) return;
            if (isResponding) return;

            const ch = data.characters.find(c => c.id === currentCharId);
            if (!ch) return;

            // 添加用户消息
            addMessage(currentCharId, 'user', text);
            chatInput.value = '';

            // 获取 API：优先取 currentApiId，无则兜底第一个
            let api = data.apis.find(a => a.id === data.currentApiId);
            if (!api) api = data.apis[0];
            if (!api) {
                addMessage(currentCharId, 'assistant', '⚠️ 请先在「设置」中添加 API 配置。');
                return;
            }
            if (!api) {
                addMessage(currentCharId, 'assistant', '⚠️ 请先在「设置」中添加 API 配置。');
                return;
            }

            isResponding = true;
            respondBtn.style.opacity = '0.5';

            let streamMsg = null;
            let streamed = '';
            let streamEl = null;
            // --- 思考分流状态机（跨 SSE chunk 安全）---
            // 兼容：delta.reasoning_content（DeepSeek R1 原生）+ 正文内 <think>/<thought>/<thinking>
            let thinkBuf = '';
            let thinkTag = null;
            let pendingTag = '';
            const THINK_OPEN_RE = /<(think|thought|thinking)\b[^>]*>/i;
            // 从 content delta 分流出思考/正文增量（状态机，可跨 chunk）
            function feedBody(delta) {
                let thinkInc = '', bodyInc = '';
                let buf = pendingTag + delta;
                pendingTag = '';
                let i = 0;
                while (i < buf.length) {
                    if (thinkTag) {
                        const closeRe = new RegExp('</' + thinkTag + '\\s*>', 'i');
                        const m = closeRe.exec(buf.slice(i));
                        if (m) {
                            thinkInc += buf.slice(i, i + m.index);
                            i += m.index + m[0].length;
                            thinkTag = null;
                        } else {
                            const tail = buf.slice(i);
                            const lt = tail.lastIndexOf('<');
                            if (lt > -1 && tail.length - lt < 14) { thinkInc += tail.slice(0, lt); pendingTag = tail.slice(lt); }
                            else thinkInc += tail;
                            i = buf.length;
                        }
                    } else {
                        const m = THINK_OPEN_RE.exec(buf.slice(i));
                        if (m) {
                            bodyInc += buf.slice(i, i + m.index);
                            i += m.index + m[0].length;
                            thinkTag = m[1].toLowerCase();
                        } else {
                            const tail = buf.slice(i);
                            const lt = tail.lastIndexOf('<');
                            if (lt > -1 && tail.length - lt < 14) { bodyInc += tail.slice(0, lt); pendingTag = tail.slice(lt); }
                            else bodyInc += tail;
                            i = buf.length;
                        }
                    }
                }
                return { thinkInc, bodyInc };
            }
            // 流式渲染：思考块（展开+光标）+ 正文
            function updateStreamEl() {
                if (!streamEl) return;
                let html = '';
                if (thinkBuf && !streamed) {
                    // 思考进行中、正文还没出：气泡内显示提示
                    html = `<span style="font-size:11.5px;opacity:0.6">💭 思考中…</span>`;
                } else if (streamed) {
                    html = `<span>${escHtml(streamed)}</span>`;
                } else {
                    html = `<span class="typing-dots"><i></i><i></i><i></i></span>`;
                }
                streamEl.innerHTML = html;
                // 流式期间思考中：气泡显示提示，不操作头像
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            try {
                // 构建系统提示
                let systemPrompt = '';
                // 角色设定
                if (ch.setting) systemPrompt += ch.setting + '\n';
                // 世界书
                const wbIds = ch.worldBooks || [];
                const wbs = data.worldBooks.filter(w => wbIds.includes(w.id) && w.isActive !== false);
                if (wbs.length) {
                    systemPrompt += '\n【世界书规则】\n';
                    wbs.forEach(w => {
                        systemPrompt += `- ${w.name}: ${w.content}\n`;
                    });
                }
                // 全局世界书
                const globalWbs = data.worldBooks.filter(w => w.isGlobal && w.isActive !== false);
                if (globalWbs.length) {
                    systemPrompt += '\n【全局规则】\n';
                    globalWbs.forEach(w => {
                        systemPrompt += `- ${w.name}: ${w.content}\n`;
                    });
                }
                // 可用表情清单
                const charEmojiIds = ch.emojis || [];
                const charEmojis = data.emojis.filter(e => charEmojiIds.includes(e.id));
                const globalEmojis = data.emojis.filter(e => e.isGlobal);
                const availableEmojis = [...new Map([...globalEmojis, ...charEmojis].map(e => [e.id, e])).values()];
                if (availableEmojis.length) {
                    systemPrompt += '\n【可用表情】\n如果想发表情，格式是 [表情:名字]。\n名字必须严格从下面清单里一字不差地选，选不出合适的就不发，用文字表达即可：\n';
                    systemPrompt += availableEmojis.map(e => e.name).join(' / ') + '\n';
                }

                // 获取历史消息
                const history = data.chats[currentCharId] || [];
                const messages = [];
                if (systemPrompt) {
                    messages.push({ role: 'system', content: systemPrompt });
                }
                // 取最近10条
                const recent = history.slice(-10);
                recent.forEach(m => {
                    if (m.role !== 'system') {
                        messages.push({ role: m.role, content: m.content });
                    }
                });

                // 创建流式气泡：边收边显示（微信式逐字出字）
                streamMsg = { role: 'assistant', content: '', timestamp: Date.now(), streaming: true };
                data.chats[currentCharId].push(streamMsg);
                renderMessages(currentCharId);
                streamEl = chatMessages.querySelector('.msg.streaming');
                streamed = '';
                thinkBuf = '';
                thinkTag = null;
                pendingTag = '';

                // 调用 API（流式 SSE，候选地址兜底）
                const chatCandidates = buildChatCandidates(api.url);
                const reqBody = JSON.stringify({
                    model: api.model || 'gpt-3.5-turbo',
                    messages: messages,
                    max_tokens: 800,
                    temperature: 0.7,
                    stream: true,
                });
                const reqHeaders = {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + api.key,
                };
                let resp = null, lastErr = null;
                for (const u of chatCandidates) {
                    try {
                        const r = await fetch(u, { method: 'POST', headers: reqHeaders, body: reqBody });
                        if (r.ok) { resp = r; break; }
                        const errText = await r.text();
                        lastErr = new Error('API 错误: ' + r.status + ' @ ' + u + ' ' + errText);
                    } catch (err) { lastErr = err; }
                }
                if (!resp) throw (lastErr || new Error('请求失败'));

                const ctype = (resp.headers.get('content-type') || '').toLowerCase();
                if (ctype.includes('event-stream')) {
                    // SSE 流式：逐字写入气泡（思考 + 正文 分流）
                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    const NL = String.fromCharCode(10);
                    let buffer = '';
                    let usageInfo = null;
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        let nl;
                        while ((nl = buffer.indexOf(NL)) !== -1) {
                            const line = buffer.slice(0, nl).trim();
                            buffer = buffer.slice(nl + 1);
                            if (!line.startsWith('data:')) continue;
                            const payload = line.slice(5).trim();
                            if (payload === '[DONE]') { buffer = ''; break; }
                            try {
                                const json = JSON.parse(payload);
                                if (json.usage) usageInfo = json.usage;
                                const delta = json.choices?.[0]?.delta;
                                if (!delta) continue;
                                // ① 原生思考字段（DeepSeek R1 等）
                                const rc = delta.reasoning_content || delta.reasoning || '';
                                if (rc) { thinkBuf += rc; }
                                // ② 正文（可能内嵌  结构）
                                const dc = delta.content || '';
                                if (dc) {
                                    const { thinkInc, bodyInc } = feedBody(dc);
                                    if (thinkInc) thinkBuf += thinkInc;
                                    if (bodyInc) streamed += bodyInc;
                                }
                                // 流式中如有正文开始流出，思考块自动收起（贴在上方）
                                updateStreamEl();
                            } catch (_) { /* 不完整 JSON，等下一块 */ }
                        }
                    }
                    // 收尾：标签跨 chunk 未闭合时，残余 pendingTag 归入对应流
                    if (pendingTag) {
                        if (thinkTag) thinkBuf += pendingTag; else streamed += pendingTag;
                        pendingTag = '';
                    }
                    // 正文里仍可能有残留的关闭标签，清掉
                    streamed = streamed.replace(/<\/?(think|thought|thinking)\b[^>]*>/gi, '').replace(/<\/?(?:reasoning|think_signature)\b[^>]*>/gi, '');
                } else {
                    // 降级：非流式 JSON
                    const json = await resp.json();
                    if (json.usage) streamMsg.tokens = (json.usage.prompt_tokens || 0) + (json.usage.completion_tokens || 0);
                    const msg0 = json.choices?.[0]?.message;
                    thinkBuf = msg0?.reasoning_content || msg0?.reasoning || '';
                    streamed = (msg0?.content || '').replace(/<\/?(think|thought|thinking)\b[^>]*>/gi, '');
                    // 若正文里仍夹有思考标签内容，提取出来
                    const mc = (msg0?.content || '').match(THINK_OPEN_RE);
                    if (mc) {
                        const closeRe = new RegExp('</' + mc[1] + '\\s*>', 'i');
                        const full = msg0.content;
                        const startIdx = full.search(THINK_OPEN_RE);
                        const closeM = closeRe.exec(full.slice(startIdx));
                        if (closeM) {
                            const innerStart = startIdx + mc[0].length;
                            const innerEnd = startIdx + closeM.index;
                            thinkBuf += full.slice(innerStart, innerEnd);
                        }
                    }
                }

                // 收尾落库：思考段存进消息（不回送给 API，省 token）
                streamMsg.content = streamed || '（没有收到回复）';
                if (thinkBuf) streamMsg.think = thinkBuf.trim();
                if (usageInfo) streamMsg.tokens = (usageInfo.prompt_tokens || 0) + (usageInfo.completion_tokens || 0);
                delete streamMsg.streaming;
                saveData();
                renderMessages(currentCharId);

            } catch (e) {
                // 清理未完成的流式气泡：有内容则保留，无内容则移除
                if (streamMsg) {
                    if (streamed) {
                        streamMsg.content = streamed;
                        if (thinkBuf) streamMsg.think = thinkBuf.trim();
                        delete streamMsg.streaming;
                    } else {
                        const arr = data.chats[currentCharId] || [];
                        const i = arr.indexOf(streamMsg);
                        if (i > -1) arr.splice(i, 1);
                    }
                    saveData();
                    renderMessages(currentCharId);
                }
                if (!streamed) {
                    addMessage(currentCharId, 'assistant', '❌ 请求失败: ' + e.message);
                }
            }

            isResponding = false;
            respondBtn.style.opacity = '1';
        }

        function normalizeBaseUrl(rawUrl) {
            let u = (rawUrl || '').trim();
            if (!u) return { base: '', force: false };
            let force = false;
            if (u.endsWith('#')) { force = true; u = u.slice(0, -1); }
            u = u.replace(/\/+$/, '');
            u = u.replace(/\/chat\/completions$/i, '');
            u = u.replace(/\/models$/i, '');
            u = u.replace(/\/+$/, '');
            return { base: u, force };
        }
        function resolveChatUrl(rawUrl) {
            const { base, force } = normalizeBaseUrl(rawUrl);
            if (!base) return '';
            return force ? base : base + '/chat/completions';
        }
        function buildChatCandidates(rawUrl) {
            const { base, force } = normalizeBaseUrl(rawUrl);
            if (!base) return [];
            if (force) return [base];
            const c1 = base + '/chat/completions';
            const c2 = /\/v1$/i.test(base) ? null : (base + '/v1/chat/completions');
            return (c2 && c2 !== c1) ? [c1, c2] : [c1];
        }
        function buildModelsCandidates(rawUrl) {
            const { base, force } = normalizeBaseUrl(rawUrl);
            if (!base) return [];
            if (force) return [base];
            const c1 = base + '/models';
            const c2 = /\/v1$/i.test(base) ? null : (base + '/v1/models');
            return (c2 && c2 !== c1) ? [c1, c2] : [c1];
        }

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        function applyTheme(key) {
            const t = THEMES[key] || THEMES.ice;
            const s = document.documentElement.style;
            s.setProperty('--bg', t.bg);
            s.setProperty('--paper', t.paper);
            s.setProperty('--ink', t.ink);
            s.setProperty('--ink-soft', t.inkSoft);

            s.setProperty('--bubble-user', t.bubbleUser);

        }

        // 将文本按 [表情:名字] 标记拆成片段：命中的转成 emoji 片段，没命中的当纯文字
        function parseEmojiSegments(text, emojiList) {
            const parts = [];
            const regex = /\[表情[:：]\s*([^\]]+?)\s*\]/g;
            let last = 0, m;
            while ((m = regex.exec(text)) !== null) {
                const before = text.slice(last, m.index);
                if (before && before.trim() !== '') parts.push({ type: 'text', text: before });
                const name = m[1].trim();
                const em = emojiList.find(e => e.name === name);
                if (em) parts.push({ type: 'emoji', emoji: em });
                else parts.push({ type: 'text', text: m[0] });
                last = regex.lastIndex;
            }
            const rest = text.slice(last);
            if (rest && rest.trim() !== '') parts.push({ type: 'text', text: rest });
            return parts;
        }

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
