<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语匣 v15 · AI 互动</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #e7f0f5;
            --paper: #f6fbfd;
            --ink: #243c50;
            --ink-soft: #5f7c90;
            --line: #cbe0ea;
            --accent: #5b9bb5;
            --accent-deep: #3d7a99;
            --rose: #d4b8b0;
            --shadow: rgba(36, 60, 80, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #d6e6ee;
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--ink);
        }

        /* ===== 手机外壳 ===== */
        .phone {
            width: 390px;
            height: 844px;
            background: var(--paper);
            border-radius: 48px;
            box-shadow:
                0 30px 80px rgba(60, 55, 50, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 0 2px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            height: 50px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-soft);
            flex-shrink: 0;
            background: var(--paper);
            z-index: 10;
            letter-spacing: 0.3px;
        }
        .status-bar .time {
            font-weight: 600;
            color: var(--ink);
        }
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .status-icons svg {
            width: 16px;
            height: 16px;
            stroke: var(--ink-soft);
            stroke-width: 1.8;
            fill: none;
        }

        /* ===== 主内容容器 ===== */
        .screen {
            flex: 1;
            overflow: hidden;
            position: relative;
            background-color: var(--paper);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ===== 桌面 ===== */
        .desktop {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px 24px 30px;
            overflow-y: auto;
            background: transparent;
        }
        .desktop-title {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--ink);
            padding: 8px 0 4px;
        }
        .desktop-sub {
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 28px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px 16px;
            justify-items: center;
            margin-top: 8px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }
        .app-icon:hover {
            transform: translateY(-2px);
        }
        .app-icon:active {
            transform: scale(0.94);
        }

        .app-icon .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 8px 20px -10px rgba(36, 72, 100, 0.25);
        }
        .app-icon:hover .icon-circle {
            background: rgba(255, 255, 255, 0.6);
        }

        .app-icon .icon-circle svg {
            width: 32px;
            height: 32px;
            stroke: var(--ink);
            stroke-width: 1.8;
            fill: none;
        }

        .app-icon .label {
            font-size: 12px;
            font-weight: 450;
            color: var(--ink-soft);
            letter-spacing: 0.2px;
            text-align: center;
        }

        /* ===== 应用页面容器 ===== */
        .app-page {
            position: absolute;
            inset: 0;
            background: var(--paper);
            display: none;
            flex-direction: column;
            z-index: 20;
            overflow: hidden;
            animation: fadeUp 0.3s ease;
        }
        .app-page.active {
            display: flex;
        }
        .app-page.chatting {
            background: transparent;
        }
        .wallpaper-card {
            margin-bottom: 14px;
        }
        .wallpaper-preview {
            margin-top: 10px;
            height: 80px;
            border-radius: var(--radius-sm);
            background-size: cover;
            background-position: center;
            background-color: rgba(160, 190, 205, 0.15);
            border: 1px solid var(--line);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 应用头部 ===== */
        .app-header {
            height: 58px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid var(--line);
            background: var(--paper);
        }
        .app-header .back {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--ink-soft);
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 0;
        }
        .app-header .back:hover {
            color: var(--ink);
        }
        .app-header .back svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .app-header .title {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: var(--ink);
        }
        .app-header .right-action {
            cursor: pointer;
            font-size: 14px;
            color: var(--ink-soft);
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .app-header .right-action:hover {
            color: var(--ink);
        }
        .app-header .right-action svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 应用内容 ===== */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 20px;
            background: var(--paper);
        }
        .app-body::-webkit-scrollbar {
            width: 3px;
        }
        .app-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-body::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 10px;
        }

        /* ===== 通用卡片 ===== */
        .card {
            background: var(--paper);
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            padding: 14px 16px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #d5ccc4;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .card-row .label {
            font-size: 14px;
            font-weight: 450;
            color: var(--ink);
        }
        .card-row .sub {
            font-size: 13px;
            color: var(--ink-soft);
        }

        .btn {
            background: var(--bg);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 480;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid transparent;
            font-family: var(--font);
        }
        .btn:hover {
            background: #e8e0d8;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
        }
        .btn-soft {
            background: transparent;
            border-color: var(--line);
        }
        .btn-soft:hover {
            background: var(--bg);
        }
        .btn-danger {
            color: #c97b6f;
            background: transparent;
            border-color: #f0e0dc;
        }
        .btn-danger:hover {
            background: #fdf0ed;
            border-color: #dbb8b0;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 20px;
        }

        input,
        select,
        textarea {
            font-family: var(--font);
            font-size: 14px;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 181, 160, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 480;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }

        .tag {
            display: inline-block;
            background: var(--bg);
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 12px;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }
        .tag-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-soft);
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--line);
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ===== 设置页面 ===== */
        .api-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .api-item .info {
            flex: 1;
            min-width: 0;
        }
        .api-item .info .name {
            font-weight: 500;
            font-size: 14px;
        }
        .api-item .info .detail {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
            word-break: break-all;
        }
        .api-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .model-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .model-chip {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--line);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--paper);
            color: var(--ink-soft);
        }
        .model-chip:hover {
            border-color: var(--accent);
            color: var(--ink);
        }
        .model-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== 微信 - 人设列表 ===== */
        .chat-list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            border-radius: 8px;
            padding: 12px 8px;
        }
        .chat-list-item:hover {
            background: var(--bg);
        }
        .chat-list-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 20px;
            color: var(--ink-soft);
        }
        .chat-list-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-list-item .info .name {
            font-weight: 500;
            font-size: 15px;
        }
        .chat-list-item .info .preview {
            font-size: 13px;
            color: var(--ink-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-list-item .time {
            font-size: 12px;
            color: var(--ink-soft);
            flex-shrink: 0;
        }

        /* ===== 微信 - 聊天界面 ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(230, 240, 245, 0.4);
        }
        .chat-messages .msg {
            max-width: 85%;
            width: fit-content;
            padding: 11px 15px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
            animation: msgIn 0.34s cubic-bezier(0.21, 1, 0.32, 1);
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.94);
            }
            60% {
                transform: translateY(2px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .chat-messages .msg.user {
            align-self: flex-end;
            background: rgba(91, 155, 181, 0.55);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            backdrop-filter: blur(14px) saturate(150%);
            border: 1px solid rgba(70, 130, 160, 0.4);
            color: #fff;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(0, 0, 0, 0.06),
                0 6px 16px -6px rgba(36, 72, 100, 0.4),
                0 2px 5px -2px rgba(36, 72, 100, 0.2);
        }
        .chat-messages .msg.assistant {
            align-self: flex-start;
            background: rgba(246, 251, 253, 0.6);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            backdrop-filter: blur(14px) saturate(150%);
            border: 1px solid rgba(160, 190, 205, 0.5);
            color: var(--ink);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 6px 16px -6px rgba(36, 72, 100, 0.18),
                0 2px 5px -2px rgba(36, 72, 100, 0.12);
        }
        .chat-messages .msg.system {
            align-self: center;
            background: transparent;
            color: var(--ink-soft);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px dashed var(--line);
            max-width: 90%;
        }
        .chat-messages .msg.streaming .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
        }
        .chat-messages .msg.streaming .typing-dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ink-soft);
            animation: typingBlink 1.2s infinite ease-in-out;
        }
        .chat-messages .msg.streaming .typing-dots i:nth-child(2) { animation-delay: .2s; }
        .chat-messages .msg.streaming .typing-dots i:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBlink {
            0%, 60%, 100% { opacity: .25; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-2px); }
        }
        .chat-messages .msg .voice-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink-soft);
            font-size: 13px;
        }
        .chat-messages .msg .voice-label svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 消息行布局：头像 + 气泡（微信式）===== */
        .chat-messages .msg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 16px;
            animation: msgIn 0.34s cubic-bezier(0.21, 1, 0.32, 1);
        }
        .chat-messages .msg-row.compact-prev {
            margin-bottom: 16px;
        }
        .chat-messages .msg-row.same-sender {
            margin-top: -10px;
            animation: msgIn 0.24s cubic-bezier(0.21, 1, 0.32, 1);
        }
        .chat-messages .msg-row:last-child {
            margin-bottom: 6px;
        }
        .chat-messages .msg-row.user {
            flex-direction: row-reverse;
        }
        .chat-messages .msg-row.system {
            justify-content: center;
            margin-bottom: 14px;
        }
        .chat-messages .msg-row .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #f0f7fb, #e3eef4);
            border: 1px solid rgba(160, 190, 205, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--ink-soft);
            overflow: hidden;
            user-select: none;
            box-shadow: 0 2px 6px -2px rgba(36, 60, 80, 0.18);
            position: relative;
        }
        .chat-messages .msg-row .msg-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-messages .msg-row.user .msg-avatar {
            background: linear-gradient(135deg, #5b9bb5, #3d7a99);
            color: #fff;
            border-color: rgba(61, 122, 153, 0.5);
        }
        .chat-messages .msg-row .msg-avatar.has-think {
            cursor: pointer;
        }
        .chat-messages .msg-row .msg-avatar.has-think::after {
            content: '💭';
            position: absolute;
            bottom: -3px;
            right: -4px;
            font-size: 13px;
            background: var(--paper);
            border-radius: 50%;
            width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }
        .chat-messages .msg-row .msg-bubble-wrap {
            min-width: 60px;
            max-width: 85%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .chat-messages .msg-row.user .msg-bubble-wrap {
            align-items: flex-end;
        }
        /* 思考浮层样式全部用内联 style 写在 #thinkOverlay 标签上，不在这里定义 */
        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px 14px;
            background: var(--paper);
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }
        .chat-input-bar .input-wrap {
            flex: 1;
            position: relative;
        }
        .chat-input-bar .input-wrap input {
            padding: 10px 14px;
            border-radius: 30px;
            background: var(--bg);
            border: 1px solid var(--line);
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar .input-wrap input:focus {
            border-color: var(--accent);
        }

        .chat-input-bar .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            color: var(--ink-soft);
        }
        .chat-input-bar .icon-btn:hover {
            background: var(--bg);
            border-color: #d0c8c0;
            color: var(--ink);
        }
        .chat-input-bar .icon-btn:active {
            transform: scale(0.92);
        }
        .chat-input-bar .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .chat-input-bar .icon-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .chat-input-bar .icon-btn.primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
        }

        /* ===== 功能栏弹出 ===== */
        .action-popup {
            position: absolute;
            bottom: 70px;
            left: 14px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 40px rgba(60, 55, 50, 0.12);
            padding: 8px 0;
            min-width: 160px;
            display: none;
            z-index: 30;
        }
        .action-popup.open {
            display: block;
            animation: fadeUp 0.2s ease;
        }
        .action-popup .item {
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
            color: var(--ink);
        }
        .action-popup .item:hover {
            background: var(--bg);
        }
        .action-popup .item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 世界书 ===== */
        .wb-group {
            margin-bottom: 20px;
        }

            border-bottom: 1px solid var(--line);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        .wb-item:last-child {
            border-bottom: none;
        }
        .wb-item .info {
            flex: 1;
            min-width: 0;
        }
        .wb-item .info .name {
            font-weight: 450;
            font-size: 14px;
        }
        .wb-item .info .desc {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
            word-break: break-word;
        }
        .wb-item .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ink-soft);
        }
        .wb-item .toggle-wrap .toggle-track {
            width: 38px;
            height: 22px;
            border-radius: 30px;
            background: var(--line);
            position: relative;
            cursor: pointer;
            transition: background 0.25s;
            flex-shrink: 0;
        }
        .wb-item .toggle-wrap .toggle-track .thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.25s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .wb-item .toggle-wrap .toggle-track.on {
            background: var(--accent);
        }
        .wb-item .toggle-wrap .toggle-track.on .thumb {
            transform: translateX(16px);
        }

        /* ===== 模态框 ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(60, 55, 50, 0.25);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-mask.open {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--paper);
            border-radius: var(--radius);
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px 28px;

            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            0% {
                transform: scale(0.94);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;

            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: -0.2px;

            min-width: 70px;

        }

        /* ===== 表情包网格 ===== */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;

        .emoji-grid .emoji-item {

            align-items: center;
            justify-content: center;
            font-size: 13px;

            background: var(--paper);
            overflow: hidden;
            position: relative;
            padding: 4px;
        }
        .emoji-grid .emoji-item:hover {
            border-color: var(--accent);
            transform: scale(1.03);
        }
        .emoji-grid .emoji-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .emoji-grid .emoji-item .label {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;

            background: rgba(255, 255, 255, 0.7);
            padding: 0 4px;
            border-radius: 4px;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 滚动条美化 ===== */
        .app-body::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 3px;
        }

            background: var(--line);

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        const DB_KEY = 'healPhoneData';

        function getDefaultData() {
            return {
                apis: [],
                characters: [],
                chats: {},
                worldBooks: [],
                wbGroups: ['默认'],
                emojis: [],
                wallpaper: '',
            };
        }

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    // 保证字段完整
                    const def = getDefaultData();
                    for (const k in def) { if (!(k in d)) d[k] = def[k]; }
                    return d;
                }
            } catch (_) { /* ignore */ }
            return getDefaultData();
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        // ============================================================
        //  API 工具
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        // ============================================================
        //  状态管理
        // ============================================================
        let currentPage = 'desktop';
        let currentCharId = null;
        let currentApiId = null;
        let editingApiId = null;
        let editingCharId = null;
        let editingWbId = null;
        let editingWbGroup = null;
        let isResponding = false;
        let emojiImportFiles = [];

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const desktop = $('#desktop');
        const pages = {
            settings: $('#page-settings'),
            wechat: $('#page-wechat'),
            worldbook: $('#page-worldbook'),
        };
        const settingsBody = $('#settingsBody');
        const apiListEl = $('#apiList');
        const apiEmpty = $('#apiEmpty');
        const charListEl = $('#charList');
        const charEmpty = $('#charEmpty');
        const wechatTitle = $('#wechatTitle');
        const chatView = $('#chatView');
        const chatMessages = $('#chatMessages');
        const chatCharName = $('#chatCharName');
        const chatInput = $('#chatInput');
        const respondBtn = $('#respondBtn');
        const actionBtn = $('#actionBtn');
        const actionPopup = $('#actionPopup');
        const voiceAction = $('#voiceAction');
        const emojiAction = $('#emojiAction');
        const wbListEl = $('#wbList');
        const wbEmpty = $('#wbEmpty');
        const modalMask = $('#modalMask');
        const modalBox = $('#modalBox');
        const statusTime = $('#statusTime');

        // ============================================================
        //  路由 / 页面切换
        // ============================================================
        function showPage(name) {
            // 隐藏所有
            Object.keys(pages).forEach(k => pages[k].classList.remove('active'));
            desktop.style.display = 'none';
            // 隐藏聊天子视图
            chatView.style.display = 'none';
            // 显示目标
            if (name === 'desktop') {
                desktop.style.display = 'flex';
                currentPage = 'desktop';
                return;
            }
            if (pages[name]) {
                pages[name].classList.add('active');
                currentPage = name;
                if (name === 'settings') renderSettings();
                if (name === 'wechat') renderChars();
                if (name === 'worldbook') renderWorldBooks();
                // 如果是从微信返回，关闭聊天视图
                if (name !== 'wechat') {
                    chatView.style.display = 'none';
                    document.getElementById('wechatBody').style.display = 'block';
                }
            }
        }

        // 桌面图标点击
        $$('.app-icon[data-page]').forEach(el => {
            el.addEventListener('click', () => {
                const page = el.dataset.page;
                if (page === 'settings') showPage('settings');

        const exportBtn = document.getElementById('exportBtn');

        if (exportBtn) {
            exportBtn.addEventListener('click', () => {
                const includeKey = document.getElementById('includeKey');
                const keepKey = !!(includeKey && includeKey.checked);
                // 深拷贝当前数据
                const backup = JSON.parse(JSON.stringify(data));
                // 按需清除 API key
                if (!keepKey && backup.apis) {
                    backup.apis.forEach(a => { if (a.key) a.key = ''; });
                }
                // 表情包体积大，提示是否包含
                let emojiCount = (backup.emojis || []).length;
                const meta = {
                    exportedAt: new Date().toISOString(),
                    version: 'v1',
                    includeKey: keepKey,
                    counts: {
                        apis: (backup.apis || []).length,
                        characters: (backup.characters || []).length,
                        worldBooks: (backup.worldBooks || []).length,
                        emojis: emojiCount,
                        wallpaper: backup.wallpaper ? 1 : 0,
                    },
                };
                const payload = { __meta: meta, data: backup };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                a.href = url;
                a.download = `katari-backup-${ts}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                const keyHint = keepKey ? '（含密钥，请勿外传）' : '（不含密钥）';
                alert(`已导出备份文件${keyHint}\nAPI ${meta.counts.apis} · 角色 ${meta.counts.characters} · 世界书 ${meta.counts.worldBooks} · 表情包 ${meta.counts.emojis}`);
            });

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        // 兼容两种格式：{__meta, data} 或 直接是 data
                        const incoming = parsed.__meta ? parsed.data : parsed;
                        if (!incoming || typeof incoming !== 'object') throw new Error('格式不对');
                        // 字段补齐，防止导入旧版缺字段
                        const def = getDefaultData();
                        const merged = {};
                        for (const k in def) {
                            merged[k] = (k in incoming) ? incoming[k] : def[k];
                        }
                        if (!confirm('导入将覆盖当前所有数据（不可恢复），确认继续？')) return;

                };
                reader.readAsText(file);
                importFile.value = '';
            });
        }

        function renderMessages(charId) {
            const msgs = data.chats[charId] || [];
            if (!msgs.length) {
                chatMessages.innerHTML = `
                    <div class="msg-row system"><div class="msg system">💬 开始对话吧</div></div>
                `;
                return;
            }
            const ch = data.characters.find(c => c.id === charId);
            // 助手头像 HTML（URL 优先，否则首字符）
            const avatarHtml = (c) => c && c.avatar
                ? `<img src="${escHtml(c.avatar)}" alt="" />`
                : escHtml((c && c.name ? c.name.charAt(0) : 'AI'));
            const hasThink = (m) => !!(m.think && String(m.think).trim());

            chatMessages.innerHTML = msgs.map((m, idx) => {
                if (m.role === 'system') {
                    return `<div class="msg-row system"><div class="msg system">${escHtml(m.content)}</div></div>`;
                }
                const isUser = m.role === 'user';
                const cls = isUser ? 'user' : 'assistant';
                // 同一人连续消息：上一条非 system 且 role 相同 → 间距紧凑
                const prev = msgs[idx - 1];
                const sameSender = prev && prev.role !== 'system' && prev.role === m.role;
                const rowCls = sameSender ? `${cls} same-sender` : cls;

                // 头像：助手用角色头像，用户用固定头像；助手有 think 时加 has-think
                const avInner = isUser ? '我' : avatarHtml(ch);
                const showThink = !isUser && hasThink(m);
                const thinkCls = showThink ? ' has-think' : '';
                // 每个段落都要有自己的头像，data-msg-idx 都指向同一条消息
                const avatarDiv = `<div class="msg-avatar${thinkCls}" data-msg-idx="${idx}">${avInner}</div>`;

                // 流式消息：保留单个大气泡实时显示（性能 + 视觉连贯）
                if (m.streaming) {
                    return `<div class="msg-row ${rowCls}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls} streaming"><span class="typing-dots"><i></i><i></i><i></i></span></div></div></div>`;
                }

                // 语音 / 表情包：不拆分，整条渲染
                if (m.isVoice) {
                    const vcontent = `<div class="voice-label"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke-linecap="round"/><path d="M19 10v2a7 7 0 01-14 0v-2" stroke-linecap="round"/></svg>🎤 ${escHtml(m.content)}</div>`;
                    return `<div class="msg-row ${rowCls}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}">${vcontent}</div></div></div>`;
                }
                if (m.isEmoji && m.emojiName) {
                    return `<div class="msg-row ${rowCls}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}">😊 ${escHtml(m.emojiName)}</div></div></div>`;
                }

                // 普通消息：按换行拆成多段，每段一个独立 .msg-row（各自带头像）
                const paras = String(m.content || '').split(/\n+/).filter(p => p.trim() !== '');
                if (!paras.length) {
                    // 防御：空内容也要有个占位气泡
                    return `<div class="msg-row ${rowCls}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}"> </div></div></div>`;
                }
                // 每段生成独立行，第 2 段起用紧凑间距（same-sender 已含 margin-top:-10px）
                const rows = paras.map(p =>
                    `<div class="msg-row ${rowCls}">${avatarDiv}<div class="msg-bubble-wrap"><div class="msg ${cls}">${escHtml(p)}</div></div></div>`
                ).join('');
                return rows;
            }).join('');

            // 气泡间距：同一人连续气泡之间紧凑(4px)，不同人之间宽松(16px)
            // 已通过 .same-sender 的 margin-top:-10px 实现，这里不再额外处理

            // 绑定助手头像双击 → 弹出思考浮层（按 data-msg-idx 回查消息 think）
            // 手机端原生 dblclick 不生效，改用 200ms 内两次 click 模拟双击
            chatMessages.querySelectorAll('.msg-avatar.has-think').forEach(el => {
                let lastTap = 0;
                el.addEventListener('click', (e) => {
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        // 双击触发
                        e.preventDefault();
                        e.stopPropagation();
                        const idx = parseInt(el.getAttribute('data-msg-idx'), 10);
                        const m = msgs[idx];
                        // 防御：流式消息可能还没存 think，或索引越界，绝不报错
                        if (!m || !m.think) { lastTap = 0; return; }
                        const text = String(m.think).trim();
                        if (text) showThinkOverlay(m.think);
                        lastTap = 0;
                    } else {
                        lastTap = now;
                    }
                });
            });

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 思考浮层：显示 / 关闭（浮层 + ✕按钮 同步显隐）
        function showThinkOverlay(text) {
            const overlay = document.getElementById('thinkOverlay');
            const cont = document.getElementById('thinkContent');
            const closeBtn = document.getElementById('thinkCloseBtn');
            if (!overlay || !cont) return;
            cont.textContent = text;
            overlay.style.display = 'block';
            if (closeBtn) closeBtn.style.display = 'block';
        }
        function hideThinkOverlay() {
            const overlay = document.getElementById('thinkOverlay');
            const closeBtn = document.getElementById('thinkCloseBtn');
            if (overlay) overlay.style.display = 'none';
            if (closeBtn) closeBtn.style.display = 'none';
        }

        // 发送消息
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            if (!currentCharId) return;
            if (isResponding) return;

            const ch = data.characters.find(c => c.id === currentCharId);
            if (!ch) return;

            // 添加用户消息
            addMessage(currentCharId, 'user', text);
            chatInput.value = '';

            // 获取 API
            const api = data.apis[0]; // 使用第一个 API
            if (!api) {
                addMessage(currentCharId, 'assistant', '⚠️ 请先在「设置」中添加 API 配置。');
                return;
            }

            isResponding = true;
            respondBtn.style.opacity = '0.5';

            let streamMsg = null;
            let streamed = '';
            let streamEl = null;
            // --- 思考分流状态机（跨 SSE chunk 安全）---
            // 兼容：delta.reasoning_content（DeepSeek R1 原生）+ 正文内 <think>/<thought>/<thinking>
            let thinkBuf = '';
            let thinkTag = null;
            let pendingTag = '';
            const THINK_OPEN_RE = /<(think|thought|thinking)\b[^>]*>/i;
            // 从 content delta 分流出思考/正文增量（状态机，可跨 chunk）
            function feedBody(delta) {
                let thinkInc = '', bodyInc = '';
                let buf = pendingTag + delta;
                pendingTag = '';
                let i = 0;
                while (i < buf.length) {
                    if (thinkTag) {
                        const closeRe = new RegExp('</' + thinkTag + '\\s*>', 'i');
                        const m = closeRe.exec(buf.slice(i));
                        if (m) {
                            thinkInc += buf.slice(i, i + m.index);
                            i += m.index + m[0].length;
                            thinkTag = null;
                        } else {
                            const tail = buf.slice(i);
                            const lt = tail.lastIndexOf('<');
                            if (lt > -1 && tail.length - lt < 14) { thinkInc += tail.slice(0, lt); pendingTag = tail.slice(lt); }
                            else thinkInc += tail;
                            i = buf.length;
                        }
                    } else {
                        const m = THINK_OPEN_RE.exec(buf.slice(i));
                        if (m) {
                            bodyInc += buf.slice(i, i + m.index);
                            i += m.index + m[0].length;
                            thinkTag = m[1].toLowerCase();
                        } else {
                            const tail = buf.slice(i);
                            const lt = tail.lastIndexOf('<');
                            if (lt > -1 && tail.length - lt < 14) { bodyInc += tail.slice(0, lt); pendingTag = tail.slice(lt); }
                            else bodyInc += tail;
                            i = buf.length;
                        }
                    }
                }
                return { thinkInc, bodyInc };
            }
            // 流式渲染：思考块（展开+光标）+ 正文
            function updateStreamEl() {
                if (!streamEl) return;
                let html = '';
                if (thinkBuf && !streamed) {
                    // 思考进行中、正文还没出：气泡内显示提示
                    html = `<span style="font-size:11.5px;opacity:0.6">💭 思考中…</span>`;
                } else if (streamed) {
                    html = `<span>${escHtml(streamed)}</span>`;
                } else {
                    html = `<span class="typing-dots"><i></i><i></i><i></i></span>`;
                }
                streamEl.innerHTML = html;
                // 思考有内容时，给同行助手头像加 has-think 角标（流式结束后可双击查看）
                if (streamEl) {
                    const row = streamEl.closest('.msg-row');
                    const av = row && row.querySelector('.msg-avatar');
                    if (av) {
                        if (thinkBuf && String(thinkBuf).trim()) {
                            av.classList.add('has-think');
                        } else {
                            av.classList.remove('has-think');
                        }
                    }
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            try {
                // 构建系统提示
                let systemPrompt = '';
                // 角色设定
                if (ch.setting) systemPrompt += ch.setting + '\n';
                // 世界书
                const wbIds = ch.worldBooks || [];
                const wbs = data.worldBooks.filter(w => wbIds.includes(w.id) && w.isActive !== false);
                if (wbs.length) {
                    systemPrompt += '\n【世界书规则】\n';
                    wbs.forEach(w => {
                        systemPrompt += `- ${w.name}: ${w.content}\n`;
                    });
                }
                // 全局世界书
                const globalWbs = data.worldBooks.filter(w => w.isGlobal && w.isActive !== false);
                if (globalWbs.length) {
                    systemPrompt += '\n【全局规则】\n';
                    globalWbs.forEach(w => {
                        systemPrompt += `- ${w.name}: ${w.content}\n`;
                    });
                }

                // 获取历史消息
                const history = data.chats[currentCharId] || [];
                const messages = [];
                if (systemPrompt) {
                    messages.push({ role: 'system', content: systemPrompt });
                }
                // 取最近10条
                const recent = history.slice(-10);
                recent.forEach(m => {
                    if (m.role !== 'system') {
                        messages.push({ role: m.role, content: m.content });
                    }
                });

                // 创建流式气泡：边收边显示（微信式逐字出字）
                streamMsg = { role: 'assistant', content: '', timestamp: Date.now(), streaming: true };
                data.chats[currentCharId].push(streamMsg);
                renderMessages(currentCharId);
                streamEl = chatMessages.querySelector('.msg.streaming');
                streamed = '';
                thinkBuf = '';
                thinkTag = null;
                pendingTag = '';

                // 调用 API（流式 SSE）

                // 调用 API（流式 SSE）
                const resp = await fetch(api.url + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + api.key,
                    },
                    body: JSON.stringify({
                        model: api.model || 'gpt-3.5-turbo',
                        messages: messages,
                        max_tokens: 800,
                        temperature: 0.7,
                        stream: true,
                    }),
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error('API 错误: ' + resp.status + ' ' + errText);
                }

                const ctype = (resp.headers.get('content-type') || '').toLowerCase();
                if (ctype.includes('event-stream')) {
                    // SSE 流式：逐字写入气泡（思考 + 正文 分流）
                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    const NL = String.fromCharCode(10);
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        let nl;
                        while ((nl = buffer.indexOf(NL)) !== -1) {
                            const line = buffer.slice(0, nl).trim();
                            buffer = buffer.slice(nl + 1);
                            if (!line.startsWith('data:')) continue;
                            const payload = line.slice(5).trim();
                            if (payload === '[DONE]') { buffer = ''; break; }
                            try {
                                const json = JSON.parse(payload);
                                const delta = json.choices?.[0]?.delta;
                                if (!delta) continue;
                                // ① 原生思考字段（DeepSeek R1 等）
                                const rc = delta.reasoning_content || delta.reasoning || '';
                                if (rc) { thinkBuf += rc; }
                                // ② 正文（可能内嵌  结构）
                                const dc = delta.content || '';
                                if (dc) {
                                    const { thinkInc, bodyInc } = feedBody(dc);
                                    if (thinkInc) thinkBuf += thinkInc;
                                    if (bodyInc) streamed += bodyInc;
                                }
                                // 流式中如有正文开始流出，思考块自动收起（贴在上方）
                                updateStreamEl();
                            } catch (_) { /* 不完整 JSON，等下一块 */ }
                        }
                    }
                    // 收尾：标签跨 chunk 未闭合时，残余 pendingTag 归入对应流
                    if (pendingTag) {
                        if (thinkTag) thinkBuf += pendingTag; else streamed += pendingTag;
                        pendingTag = '';
                    }
                    // 正文里仍可能有残留的关闭标签，清掉
                    streamed = streamed.replace(/<\/?(think|thought|thinking)\b[^>]*>/gi, '').replace(/<\/?(?:reasoning|think_signature)\b[^>]*>/gi, '');
                } else {
                    // 降级：非流式 JSON
                    const json = await resp.json();
                    const msg0 = json.choices?.[0]?.message;
                    thinkBuf = msg0?.reasoning_content || msg0?.reasoning || '';
                    streamed = (msg0?.content || '').replace(/<\/?(think|thought|thinking)\b[^>]*>/gi, '');
                    // 若正文里仍夹有思考标签内容，提取出来
                    const mc = (msg0?.content || '').match(THINK_OPEN_RE);
                    if (mc) {
                        const closeRe = new RegExp('</' + mc[1] + '\\s*>', 'i');
                        const full = msg0.content;
                        const startIdx = full.search(THINK_OPEN_RE);
                        const closeM = closeRe.exec(full.slice(startIdx));
                        if (closeM) {
                            const innerStart = startIdx + mc[0].length;
                            const innerEnd = startIdx + closeM.index;
                            thinkBuf += full.slice(innerStart, innerEnd);
                        }
                    }
                }

                // 收尾落库：思考段存进消息（不回送给 API，省 token）
                streamMsg.content = streamed || '（没有收到回复）';
                if (thinkBuf) streamMsg.think = thinkBuf.trim();
                delete streamMsg.streaming;
                saveData();
                renderMessages(currentCharId);

            } catch (e) {
                // 清理未完成的流式气泡：有内容则保留，无内容则移除
                if (streamMsg) {
                    if (streamed) {
                        streamMsg.content = streamed;
                        if (thinkBuf) streamMsg.think = thinkBuf.trim();
                        delete streamMsg.streaming;
                    } else {
                        const arr = data.chats[currentCharId] || [];
                        const i = arr.indexOf(streamMsg);
                        if (i > -1) arr.splice(i, 1);
                    }
                    saveData();
                    renderMessages(currentCharId);
                }
                if (!streamed) {
                    addMessage(currentCharId, 'assistant', '❌ 请求失败: ' + e.message);
                }
            }

            isResponding = false;
            respondBtn.style.opacity = '1';
        }

        function addMessage(charId, role, content, extra = {}) {
            if (!data.chats[charId]) data.chats[charId] = [];
            const msg = { role, content, timestamp: Date.now(), ...extra };
            data.chats[charId].push(msg);
            // 更新角色更新时间
            const ch = data.characters.find(c => c.id === charId);
            if (ch) ch.updatedAt = Date.now();
            saveData();
            renderMessages(charId);
            // 滚动到底部
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 50);
        }

        // 响应按钮
        respondBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================

        });

        voiceAction.addEventListener('click', () => {
            actionPopup.classList.remove('open');
            if (!currentCharId) return;
            const voiceTexts = [
                '嗯… 我在想呢 🤔',

        // ============================================================

            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  初始化
        // ============================================================
        // 默认数据

        const thinkOverlay = document.getElementById('thinkOverlay');
        const thinkCloseBtn = document.getElementById('thinkCloseBtn');
        if (thinkCloseBtn) {
            thinkCloseBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                hideThinkOverlay();
            });
        }
        if (thinkOverlay) {
            thinkOverlay.addEventListener('click', (e) => {
