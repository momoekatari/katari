<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语匣 v22 · AI 互动</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #e7f0f5;
            --paper: #f6fbfd;
            --ink: #243c50;
            --ink-soft: #5f7c90;
            --line: #cbe0ea;
            --accent: #5b9bb5;
            --accent-deep: #3d7a99;
            --rose: #d4b8b0;
            --shadow: rgba(36, 60, 80, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #d6e6ee;
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--ink);
        }

        /* ===== 手机外壳 ===== */
        .phone {
            width: 390px;
            height: 844px;
            background: var(--paper);
            border-radius: 48px;
            box-shadow:
                0 30px 80px rgba(60, 55, 50, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 0 2px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            height: 50px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-soft);
            flex-shrink: 0;
            background: var(--paper);
            z-index: 10;
            letter-spacing: 0.3px;
        }
        .status-bar .time {
            font-weight: 600;
            color: var(--ink);
        }
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .status-icons svg {
            width: 16px;
            height: 16px;
            stroke: var(--ink-soft);
            stroke-width: 1.8;
            fill: none;
        }

        /* ===== 主内容容器 ===== */
        .screen {
            flex: 1;
            overflow: hidden;
            position: relative;
            background-color: var(--paper);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ===== 桌面 ===== */
        .desktop {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px 20px 30px;
            overflow-y: auto;
            background: transparent;
        }
        .desktop-title {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--ink);
            padding: 8px 0 4px;
        }
        .desktop-sub {
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 28px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px 16px;
            justify-items: center;
            margin-top: 8px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }
        .app-icon:hover {
            transform: translateY(-2px);
        }
        .app-icon:active {
            transform: scale(0.94);
        }

        .app-icon .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 8px 20px -10px rgba(36, 72, 100, 0.25);
        }
        .app-icon:hover .icon-circle {
            background: rgba(255, 255, 255, 0.6);
        }

        .app-icon .icon-circle svg {
            width: 32px;
            height: 32px;
            stroke: var(--ink);
            stroke-width: 1.8;
            fill: none;
        }

        .app-icon .label {
            font-size: 12px;
            font-weight: 450;
            color: var(--ink-soft);
            letter-spacing: 0.2px;
            text-align: center;
        }

        /* ===== 应用页面容器 ===== */
        .app-page {
            position: absolute;
            inset: 0;
            background: var(--paper);
            display: none;
            flex-direction: column;
            z-index: 20;
            overflow: hidden;
            animation: fadeUp 0.3s ease;
        }
        .app-page.active {
            display: flex;
        }
        .app-page.chatting {
            background: transparent;
        }
        .wallpaper-card {
            margin-bottom: 14px;
        }
        .wallpaper-preview {
            margin-top: 10px;
            height: 80px;
            border-radius: var(--radius-sm);
            background-size: cover;
            background-position: center;
            background-color: rgba(160, 190, 205, 0.15);
            border: 1px solid var(--line);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 应用头部 ===== */
        .app-header {
            height: 58px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid var(--line);
            background: var(--paper);
        }
        .app-header .back {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--ink-soft);
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 0;
        }
        .app-header .back:hover {
            color: var(--ink);
        }
        .app-header .back svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .app-header .title {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: var(--ink);
        }
        .app-header .right-action {
            cursor: pointer;
            font-size: 14px;
            color: var(--ink-soft);
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .app-header .right-action:hover {
            color: var(--ink);
        }
        .app-header .right-action svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 应用内容 ===== */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 20px;
            background: var(--paper);
        }
        .app-body::-webkit-scrollbar {
            width: 3px;
        }
        .app-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-body::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 10px;
        }

        /* ===== 通用卡片 ===== */
        .card {
            background: var(--paper);
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            padding: 14px 16px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #d5ccc4;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .card-row .label {
            font-size: 14px;
            font-weight: 450;
            color: var(--ink);
        }
        .card-row .sub {
            font-size: 13px;
            color: var(--ink-soft);
        }

        .btn {
            background: var(--bg);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 480;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid transparent;
            font-family: var(--font);
        }
        .btn:hover {
            background: #e8e0d8;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
        }
        .btn-soft {
            background: transparent;
            border-color: var(--line);
        }
        .btn-soft:hover {
            background: var(--bg);
        }
        .btn-danger {
            color: #c97b6f;
            background: transparent;
            border-color: #f0e0dc;
        }
        .btn-danger:hover {
            background: #fdf0ed;
            border-color: #dbb8b0;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 20px;
        }

        input,
        select,
        textarea {
            font-family: var(--font);
            font-size: 14px;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 181, 160, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 480;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }

        .tag {
            display: inline-block;
            background: var(--bg);
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 12px;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }
        .tag-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-soft);
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--line);
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ===== 设置页面 ===== */
        .api-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .api-item .info {
            flex: 1;
            min-width: 0;
        }
        .api-item .info .name {
            font-weight: 500;
            font-size: 14px;
        }
        .api-item .info .detail {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
            word-break: break-all;
        }
        .api-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .model-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .model-chip {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--line);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--paper);
            color: var(--ink-soft);
        }
        .model-chip:hover {
            border-color: var(--accent);
            color: var(--ink);
        }
        .model-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== 微信 - 人设列表 ===== */
        .chat-list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            border-radius: 8px;
            padding: 12px 8px;
        }
        .chat-list-item:hover {
            background: var(--bg);
        }
        .chat-list-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 20px;
            color: var(--ink-soft);
        }
        .chat-list-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-list-item .info .name {
            font-weight: 500;
            font-size: 15px;
        }
        .chat-list-item .info .preview {
            font-size: 13px;
            color: var(--ink-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-list-item .time {
            font-size: 12px;
            color: var(--ink-soft);
            flex-shrink: 0;
        }

        /* ===== 微信 - 聊天界面 ===== */
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(230, 240, 245, 0.4);
        }
        .chat-messages .msg {
            max-width: 85%;
            width: fit-content;
            padding: 11px 15px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
            animation: msgIn 0.34s cubic-bezier(0.21, 1, 0.32, 1);
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.94);
            }
            60% {
                transform: translateY(2px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .chat-messages .msg.user {
            align-self: flex-end;
            background: var(--bubble-user);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--accent);
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            color: #fff;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(0, 0, 0, 0.06),
                0 6px 16px -6px rgba(36, 72, 100, 0.4),
                0 2px 5px -2px rgba(36, 72, 100, 0.2);
        }
        .chat-messages .msg.assistant {
            align-self: flex-start;
            background: var(--bubble-assistant);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--line);
            color: var(--ink);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 6px 16px -6px rgba(36, 72, 100, 0.18),
                0 2px 5px -2px rgba(36, 72, 100, 0.12);
        }
        .chat-messages .msg.system {
            align-self: center;
            background: transparent;
            color: var(--ink-soft);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px dashed var(--line);
            max-width: 90%;
        }
        .chat-messages .msg.streaming .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
        }
        .chat-messages .msg.streaming .typing-dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ink-soft);
            animation: typingBlink 1.2s infinite ease-in-out;
        }
        .chat-messages .msg.streaming .typing-dots i:nth-child(2) { animation-delay: .2s; }
        .chat-messages .msg.streaming .typing-dots i:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBlink {
            0%, 60%, 100% { opacity: .25; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-2px); }
        }
        .chat-messages .msg .voice-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink-soft);
            font-size: 13px;
        }
        .chat-messages .msg .voice-label svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 消息行布局：头像 + 气泡（微信式）===== */
        .chat-messages .msg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 16px;
            animation: msgIn 0.34s cubic-bezier(0.21, 1, 0.32, 1);
        }
        .chat-messages .msg-row.compact-prev {
            margin-bottom: 16px;
        }
        .chat-messages .msg-row.same-sender {
            margin-top: -10px;
            animation: msgIn 0.24s cubic-bezier(0.21, 1, 0.32, 1);
        }
        .chat-messages .msg-row:last-child {
            margin-bottom: 6px;
        }
        .chat-messages .msg-row.user {
            flex-direction: row-reverse;
        }
        .chat-messages .msg-row.system {
            justify-content: center;
            margin-bottom: 14px;
        }
        .chat-messages .msg-row .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #f0f7fb, #e3eef4);
            border: 1px solid rgba(160, 190, 205, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--ink-soft);
            overflow: hidden;
            user-select: none;
            box-shadow: 0 2px 6px -2px rgba(36, 60, 80, 0.18);
            position: relative;
        }
        .chat-messages .msg-row .msg-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-messages .msg-row.user .msg-avatar {
            background: linear-gradient(135deg, #5b9bb5, #3d7a99);
            color: #fff;
            border-color: rgba(61, 122, 153, 0.5);
        }
        .chat-messages .msg-row .msg-bubble-wrap {
            min-width: 60px;
            max-width: 85%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .chat-messages .msg-row.user .msg-bubble-wrap {
            align-items: flex-end;
        }
        /* 思考抽屉：slideUp 动画 + 提示小字 */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .chat-messages .think-hint {
            font-size: 12px;
            color: rgba(95, 124, 144, 0.7);
            cursor: pointer;
            padding: 2px 0 0;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px 14px;
            background: var(--paper);
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }
        .chat-input-bar .input-wrap {
            flex: 1;
            position: relative;
        }
        .chat-input-bar .input-wrap input {
            padding: 10px 14px;
            border-radius: 30px;
            background: var(--bg);
            border: 1px solid var(--line);
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar .input-wrap input:focus {
            border-color: var(--accent);
        }

        .chat-input-bar .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            color: var(--ink-soft);
        }
        .chat-input-bar .icon-btn:hover {
            background: var(--bg);
            border-color: #d0c8c0;
            color: var(--ink);
        }
        .chat-input-bar .icon-btn:active {
            transform: scale(0.92);
        }
        .chat-input-bar .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .chat-input-bar .icon-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .chat-input-bar .icon-btn.primary:hover {
            background: var(--accent-deep);
            border-color: var(--accent-deep);
        }

        /* ===== 功能栏弹出 ===== */
        .action-popup {
            position: absolute;
            bottom: 70px;
            left: 14px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 40px rgba(60, 55, 50, 0.12);
            padding: 8px 0;
            min-width: 160px;
            display: none;
            z-index: 30;
        }
        .action-popup.open {
            display: block;
            animation: fadeUp 0.2s ease;
        }
        .action-popup .item {
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
            color: var(--ink);
        }
        .action-popup .item:hover {
            background: var(--bg);
        }
        .action-popup .item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== 世界书 ===== */
        .wb-group {
            margin-bottom: 20px;
        }
        .wb-group .group-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-soft);
            padding: 4px 0 8px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        .wb-item:last-child {
            border-bottom: none;
        }
        .wb-item .info {
            flex: 1;
            min-width: 0;
        }
        .wb-item .info .name {
            font-weight: 450;
            font-size: 14px;
        }
        .wb-item .info .desc {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
            word-break: break-word;
        }
        .wb-item .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ink-soft);
        }
        .wb-item .toggle-wrap .toggle-track {
            width: 38px;
            height: 22px;
            border-radius: 30px;
            background: var(--line);
            position: relative;
            cursor: pointer;
            transition: background 0.25s;
            flex-shrink: 0;
        }
        .wb-item .toggle-wrap .toggle-track .thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.25s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .wb-item .toggle-wrap .toggle-track.on {
            background: var(--accent);
        }
        .wb-item .toggle-wrap .toggle-track.on .thumb {
            transform: translateX(16px);
        }

        /* ===== 模态框 ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(60, 55, 50, 0.25);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-mask.open {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--paper);
            border-radius: var(--radius);
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px 28px;
            box-shadow: 0 30px 80px rgba(60, 55, 50, 0.2);
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            0% {
                transform: scale(0.94);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-box .modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }
        .modal-box .modal-actions .btn {
            min-width: 70px;
            text-align: center;
        }

        /* ===== 表情包网格 ===== */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        .emoji-grid .emoji-item {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all 0.2s;
            background: var(--paper);
            overflow: hidden;
            position: relative;
            padding: 4px;
        }
        .emoji-grid .emoji-item:hover {
            border-color: var(--accent);
            transform: scale(1.03);
        }
        .emoji-grid .emoji-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .emoji-grid .emoji-item .label {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            color: var(--ink-soft);
            background: rgba(255, 255, 255, 0.7);
            padding: 0 4px;
            border-radius: 4px;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 滚动条美化 ===== */
        .app-body::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 3px;
        }
        .app-body::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track,
        .modal-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-body::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb,
        .modal-box::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 10px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 440px) {
            body {
                padding: 0;
                background: var(--paper);
                align-items: stretch;
            }
            .phone {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .status-bar {
                padding: 0 20px;
                height: 44px;
            }
            .desktop {
                padding: 14px 18px 20px;
            }
            .app-icon .icon-circle {
                width: 64px;
                height: 64px;
            }
            .app-icon .icon-circle svg {
                width: 28px;
                height: 28px;
            }
            .modal-box {
                padding: 18px 20px 22px;
            }
        }
        @media (max-width: 380px) {
            .app-icon .icon-circle {
                width: 56px;
                height: 56px;
            }
            .app-icon .icon-circle svg {
                width: 24px;
                height: 24px;
            }
            .app-grid {
                gap: 20px 12px;
            }
        }

        /* ===== 辅助 ===== */
        .flex {
            display: flex;
        }
        .flex-center {
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--ink-soft);
            font-size: 13px;
        }
        .theme-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .theme-swatch {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.15);
        }
        .theme-swatch:hover {
            transform: translateY(-2px);
        }
        .theme-swatch.active {
            border-color: var(--ink);
            box-shadow: 0 0 0 2px var(--paper) inset, 0 4px 12px -4px rgba(0, 0, 0, 0.25);
        }

        /* 滚动时禁用毛玻璃，用实色背景顶替 */
        .scrolling .chat-messages .msg.user {
            background: var(--accent);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .scrolling .chat-messages .msg.assistant {
            background: var(--paper);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .scrolling .app-icon .icon-circle {
            background: rgba(255,255,255,0.9);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .longpress-menu {
            position: fixed;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            padding: 4px 0; min-width: 120px;
            display: none; z-index: 999; font-size: 14px;
        }
        .longpress-menu.open { display: block; }
        .longpress-menu .item {
            padding: 10px 16px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; color: var(--ink);
        }
        .longpress-menu .item:hover { background: var(--bg); }
        .longpress-menu .item.delete { color: #c97b6f; }
        .msg-row .msg { -webkit-touch-callout: none; }
        .chat-messages .msg.emoji-msg {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding: 0 !important;
        }
        .chat-messages .msg.emoji-msg img {
            width: 96px;
            height: auto;
            border-radius: 12px;
            display: block;
            box-shadow: 0 6px 16px -8px rgba(36, 72, 100, 0.3);
        }
    </style>
</head>

                    <div id="wbList"></div>
                    <div class="empty-state" id="wbEmpty">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke-linecap="round"/></svg>
                        <p>还没有世界书<br />点击右上角 + 添加</p>
                    </div>
                </div>
            </div>

            <!-- ===== 表情包页面 ===== -->
            <div class="app-page" id="page-emoji">
                <div class="app-header">
                    <div class="back" data-back>
                        <svg viewBox="0 0 24 24"><path d="M19 12H5" stroke-linecap="round"/><path d="M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>返回</span>
                    </div>
                    <span class="title">表情包</span>
                    <div class="right-action" id="addEmojiBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14" stroke-linecap="round"/><path d="M5 12h14" stroke-linecap="round"/></svg>
                    </div>
                </div>
                <div class="app-body" id="emojiBody">
                    <div id="emojiLibList"></div>
                    <div class="empty-state" id="emojiEmpty">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-linecap="round"/><path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"/></svg>
                        <p>还没有表情包<br />点击右上角 + 添加外链</p>
                    </div>

            </div>

        </div><!-- /screen -->
    </div><!-- /phone -->

    <!-- ===== 模态框容器 ===== -->
    <div class="modal-mask" id="modalMask">
        <div class="modal-box" id="modalBox">
            <!-- 动态内容 -->
        </div>
    </div>

    <!-- 思考过程：底部抽屉（Bottom Sheet）-->
    <div id="thinkOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:flex-end; z-index:9999;">
        <div id="thinkContent" style="width:100%; max-height:80vh; background:var(--paper); border-radius:24px 24px 0 0; padding:20px 24px 30px; box-sizing:border-box; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,0.1); animation:slideUp 0.3s ease;">
            <div style="width:36px; height:4px; background:#cbd5e1; border-radius:4px; margin:0 auto 16px; flex-shrink:0;"></div>
            <div style="font-size:16px; font-weight:700; color:var(--ink); flex-shrink:0;">思考过程</div>
            <div id="thinkBody" style="flex:1; overflow-y:auto; font-size:15px; line-height:1.8; color:var(--ink); white-space:pre-wrap; word-break:break-word; margin-top:10px;"></div>
        </div>
    </div>

    <!-- 长按消息菜单 -->
    <div id="longpressMenu" class="longpress-menu"></div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        const DB_KEY = 'healPhoneData';

        function getDefaultData() {
            return {
                apis: [],
                currentApiId: '',
                characters: [],
                chats: {},
                worldBooks: [],
                wbGroups: ['默认'],
                emojis: [],
                emojiGroups: ['默认'],
                wallpaper: '',
                theme: 'ice',
                userAvatar: '',
            };
        }

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    // 保证字段完整
                    const def = getDefaultData();
                    for (const k in def) { if (!(k in d)) d[k] = def[k]; }
                    return d;
                }
            } catch (_) { /* ignore */ }
            return getDefaultData();
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        // ============================================================
        //  API 工具
        // ============================================================
        const THEMES = {
            ice: {
                name: '冰蓝',
                bg: '#e7f0f5', paper: '#f6fbfd', ink: '#243c50', inkSoft: '#5f7c90',
                line: '#cbe0ea', accent: '#5b9bb5', accentDeep: '#3d7a99',
                bubbleUser: 'rgba(91, 155, 181, 0.42)',
                bubbleAssistant: 'rgba(246, 251, 253, 0.55)',
            },
            peach: {
                name: '蜜桃',
                bg: '#fdf0ea', paper: '#fff9f5', ink: '#4d3833', inkSoft: '#a08781',
                line: '#f0d9cc', accent: '#d48b73', accentDeep: '#b56d55',
                bubbleUser: 'rgba(212, 139, 115, 0.42)',
                bubbleAssistant: 'rgba(255, 249, 245, 0.55)',
            },
            matcha: {
                name: '抹茶',
                bg: '#eaf0e5', paper: '#f7fbf2', ink: '#384033', inkSoft: '#7d8a75',
                line: '#d3e0c8', accent: '#7ba065', accentDeep: '#5f8449',
                bubbleUser: 'rgba(123, 160, 101, 0.42)',
                bubbleAssistant: 'rgba(247, 251, 242, 0.55)',
            },
            violet: {
                name: '紫罗兰',
                bg: '#efeaf5', paper: '#faf7fd', ink: '#3f3548', inkSoft: '#8a7f96',
                line: '#ded3ea', accent: '#9b7fc0', accentDeep: '#7c5fa3',
                bubbleUser: 'rgba(155, 127, 192, 0.42)',
                bubbleAssistant: 'rgba(250, 247, 253, 0.55)',
            },
            snow: {
                name: '初雪灰',
                bg: '#eff1f3', paper: '#fafbfc', ink: '#2a3138', inkSoft: '#6b7480',
                line: '#dde2e7', accent: '#7c92a8', accentDeep: '#5b7288',
                bubbleUser: 'rgba(124, 146, 168, 0.42)',
                bubbleAssistant: 'rgba(250, 251, 252, 0.55)',
            },
        };

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        // ============================================================
        //  状态管理
        // ============================================================
        let currentPage = 'desktop';
        let currentCharId = null;
        let currentApiId = null;
        let editingApiId = null;
        let editingCharId = null;
        let editingWbId = null;
        let editingWbGroup = null;
        let isResponding = false;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const desktop = $('#desktop');
        const pages = {
            settings: $('#page-settings'),
            wechat: $('#page-wechat'),
            worldbook: $('#page-worldbook'),
            emoji: $('#page-emoji'),
        };
        const settingsBody = $('#settingsBody');
        const apiListEl = $('#apiList');
        const apiEmpty = $('#apiEmpty');
        const charListEl = $('#charList');
        const charEmpty = $('#charEmpty');
        const wechatTitle = $('#wechatTitle');
        const chatView = $('#chatView');
        const chatMessages = $('#chatMessages');
        const chatCharName = $('#chatCharName');
        const chatInput = $('#chatInput');
        const respondBtn = $('#respondBtn');
        const actionBtn = $('#actionBtn');
        const actionPopup = $('#actionPopup');
        const voiceAction = $('#voiceAction');
        const wbListEl = $('#wbList');
        const wbEmpty = $('#wbEmpty');
        const modalMask = $('#modalMask');
        const modalBox = $('#modalBox');
        const statusTime = $('#statusTime');

        // ============================================================
        //  路由 / 页面切换
        // ============================================================
        function showPage(name) {
            // 隐藏所有
            Object.keys(pages).forEach(k => pages[k].classList.remove('active'));
            desktop.style.display = 'none';
            // 隐藏聊天子视图
            chatView.style.display = 'none';
            // 显示目标
            if (name === 'desktop') {
                desktop.style.display = 'flex';
                currentPage = 'desktop';
                return;
            }
            if (pages[name]) {
                pages[name].classList.add('active');
                currentPage = name;
                if (name === 'settings') renderSettings();
                if (name === 'wechat') renderChars();
                if (name === 'worldbook') renderWorldBooks();
                if (name === 'emoji') renderEmojiLib();
                // 如果是从微信返回，关闭聊天视图
                if (name !== 'wechat') {
                    chatView.style.display = 'none';
                    document.getElementById('wechatBody').style.display = 'block';
                }
            }
        }

        // 桌面图标点击
        $$('.app-icon[data-page]').forEach(el => {
            el.addEventListener('click', () => {
                const page = el.dataset.page;
                if (page === 'settings') showPage('settings');
                else if (page === 'wechat') showPage('wechat');
                else if (page === 'worldbook') showPage('worldbook');
                else if (page === 'emoji') showPage('emoji');
            });
        });

        // 返回按钮
        $$('[data-back]').forEach(el => {
            el.addEventListener('click', () => {
                // 如果当前在聊天视图
                if (chatView.style.display === 'flex') {
                    closeChat();
                    return;
                }
                showPage('desktop');
            });
        });

        // ============================================================
        //  状态栏时钟
        // ============================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            statusTime.textContent = h + ':' + m;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // ============================================================
        //  设置页面
        // ============================================================
        function renderThemeGrid() {
            const grid = document.getElementById('themeGrid');
            if (!grid) return;
            grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
                <div class="theme-swatch ${data.theme === key ? 'active' : ''}"
                     data-theme="${key}"
                     title="${t.name}"
                     style="background: linear-gradient(135deg, ${t.accent} 0%, ${t.accent} 50%, ${t.paper} 50%, ${t.paper} 100%);"></div>
            `).join('');
            grid.querySelectorAll('.theme-swatch').forEach(el => {
                el.addEventListener('click', () => {
                    data.theme = el.dataset.theme;
                    saveData();
                    applyTheme(data.theme);
                    renderThemeGrid();
                });
            });
        }

        function renderSettings() {
            // 主题色
            renderThemeGrid();
            // 回显壁纸
            const wpInput = document.getElementById('wallpaperInput');
            if (wpInput) wpInput.value = data.wallpaper || '';
            const wpPreview = document.getElementById('wallpaperPreview');
            if (wpPreview) wpPreview.style.backgroundImage = data.wallpaper ? `url("${data.wallpaper}")` : '';
            // 回显个人头像
            const uaInput = document.getElementById('userAvatarInput');
            if (uaInput) uaInput.value = data.userAvatar || '';
            const uaPreview = document.getElementById('userAvatarPreview');
            if (uaPreview) uaPreview.style.backgroundImage = data.userAvatar ? `url("${data.userAvatar}")` : '';
            const list = data.apis;
            if (list.length === 0) {
                apiListEl.innerHTML = '';
                apiEmpty.style.display = 'block';
                return;
            }
            apiEmpty.style.display = 'none';
            apiListEl.innerHTML = list.map((api, idx) => {
                const isCurrent = (data.currentApiId === api.id) || (!data.currentApiId && idx === 0);
                return `
                <div class="card api-item ${isCurrent ? 'api-item-active' : ''}" data-api-id="${api.id}" data-action="selectApi" style="cursor:pointer; ${isCurrent ? 'border-color: var(--accent); box-shadow: 0 4px 12px -4px rgba(36, 72, 100, 0.15);' : ''}">
                    <div class="info">
                        <div class="name" style="display:flex;align-items:center;gap:6px;">
                            ${escHtml(api.name || '未命名')}
                            ${isCurrent ? `<span class="tag tag-accent" style="font-size:10px;padding:1px 8px;">当前</span>` : ''}
                        </div>
                        <div class="detail">${escHtml(api.url || '')} · ${escHtml(api.model || '未选')}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-soft" data-api-id="${api.id}" data-action="editApi" onclick="event.stopPropagation();">编辑</button>
                        <button class="btn btn-sm btn-danger" data-api-id="${api.id}" data-action="deleteApi" onclick="event.stopPropagation();">删除</button>
                    </div>
                </div>
            `}).join('');

            // 事件绑定
            apiListEl.querySelectorAll('[data-action="selectApi"]').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.apiId;
                    data.currentApiId = id;
                    saveData();
                    renderSettings();
                });
            });
            apiListEl.querySelectorAll('[data-action="editApi"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.apiId;
                    openApiModal(id);
                });
            });
            apiListEl.querySelectorAll('[data-action="deleteApi"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.apiId;
                    if (confirm('确定删除此 API 配置吗？')) {
                        data.apis = data.apis.filter(a => a.id !== id);
                        saveData();
                        renderSettings();
                    }
                });
            });
        }

        // 添加 API
        $('#addApiBtn').addEventListener('click', () => openApiModal(null));

        // 壁纸
        function applyWallpaper() {
            const screen = document.querySelector('.screen');
            if (screen) screen.style.backgroundImage = data.wallpaper ? `url("${data.wallpaper}")` : '';
        }
        applyWallpaper();
        const wpApplyBtn = document.getElementById('wallpaperApply');
        if (wpApplyBtn) {
            wpApplyBtn.addEventListener('click', () => {
                const input = document.getElementById('wallpaperInput');
                data.wallpaper = (input ? input.value : '').trim();
                saveData();
                applyWallpaper();
                const pv = document.getElementById('wallpaperPreview');
                if (pv) pv.style.backgroundImage = data.wallpaper ? `url("${data.wallpaper}")` : '';
            });
        }

        // 壁纸：从相册选图 → 转 dataURL 填进输入框
        const wpPickBtn = document.getElementById('wallpaperPickBtn');
        const wpFileInput = document.getElementById('wallpaperFile');
        if (wpPickBtn && wpFileInput) {
            wpPickBtn.addEventListener('click', () => {
                wpFileInput.click();
            });
            wpFileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { alert('请选择图片文件！'); wpFileInput.value = ''; return; }
                try {
                    const compressed = await compressImage(file, 1080, 1920, 0.85);
                    const input = document.getElementById('wallpaperInput');
                    if (input) input.value = compressed;
                    data.wallpaper = compressed;
                    try { saveData(); } catch (err) { alert('图片过大，存储失败！'); return; }
                    applyWallpaper();
                    const pv = document.getElementById('wallpaperPreview');
                    if (pv) pv.style.backgroundImage = `url("${compressed}")`;
                } catch (err) { alert('图片处理失败：' + err.message); }
                wpFileInput.value = '';
            });
        }

        // 个人头像：URL 应用 / 相册选图
        const uaApplyBtn = document.getElementById('userAvatarApply');
        if (uaApplyBtn) {
            uaApplyBtn.addEventListener('click', () => {
                const input = document.getElementById('userAvatarInput');
                data.userAvatar = (input ? input.value : '').trim();
                saveData();
                renderSettings();
                if (currentCharId) renderMessages(currentCharId);
            });
        }
        const uaPickBtn = document.getElementById('userAvatarPickBtn');
        const uaFileInput = document.getElementById('userAvatarFile');
        if (uaPickBtn && uaFileInput) {
            uaPickBtn.addEventListener('click', () => uaFileInput.click());
            uaFileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { alert('请选择图片文件！'); uaFileInput.value = ''; return; }
                try {
                    const compressedBase64 = await compressImage(file, 200, 200, 0.8);
                    data.userAvatar = compressedBase64;
                    try { saveData(); } catch (err) {
                        alert('图片太大，存储空间不足，请换一张小一点的图片。');
                        return;
                    }
                    renderSettings();
                    if (currentCharId) renderMessages(currentCharId);
                } catch (err) {
                    alert('图片处理失败：' + err.message);
                }
                uaFileInput.value = '';
            });
        }

        // ============================================================
        //  数据备份：导出 / 导入 JSON
        // ============================================================
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFile = document.getElementById('importFile');

        if (exportBtn) {
            exportBtn.addEventListener('click', () => {
                const includeKey = document.getElementById('includeKey');
                const keepKey = !!(includeKey && includeKey.checked);
                // 深拷贝当前数据
                const backup = JSON.parse(JSON.stringify(data));
                // 按需清除 API key
                if (!keepKey && backup.apis) {
                    backup.apis.forEach(a => { if (a.key) a.key = ''; });
                }
                // 表情包体积大，提示是否包含
                let emojiCount = (backup.emojis || []).length;
                const meta = {
                    exportedAt: new Date().toISOString(),
                    version: 'v1',
                    includeKey: keepKey,
                    counts: {
                        apis: (backup.apis || []).length,
                        characters: (backup.characters || []).length,
                        worldBooks: (backup.worldBooks || []).length,
                        emojis: emojiCount,
                        wallpaper: backup.wallpaper ? 1 : 0,
                    },
                };
                const payload = { __meta: meta, data: backup };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                a.href = url;
                a.download = `katari-backup-${ts}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                const keyHint = keepKey ? '（含密钥，请勿外传）' : '（不含密钥）';
                alert(`已导出备份文件${keyHint}\nAPI ${meta.counts.apis} · 角色 ${meta.counts.characters} · 世界书 ${meta.counts.worldBooks} · 表情包 ${meta.counts.emojis}`);
            });
        }

        if (importBtn) {
            importBtn.addEventListener('click', () => {
                importFile.click();
            });
        }
        if (importFile) {
            importFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        // 兼容两种格式：{__meta, data} 或 直接是 data
                        const incoming = parsed.__meta ? parsed.data : parsed;
                        if (!incoming || typeof incoming !== 'object') throw new Error('格式不对');
                        // 字段补齐，防止导入旧版缺字段
                        const def = getDefaultData();
                        const merged = {};
                        for (const k in def) {
                            merged[k] = (k in incoming) ? incoming[k] : def[k];
                        }
                        if (!confirm('导入将覆盖当前所有数据（不可恢复），确认继续？')) return;
                        data = merged;
                        saveData();
                        // 刷新界面
                        renderSettings();
                        renderChars();
                        renderWorldBooks();
                        applyWallpaper();
                        showPage('desktop');
                        alert('导入成功！数据已还原。');
                    } catch (err) {
                        alert('导入失败：' + err.message + '\n请检查文件是否为语匣导出的备份。');
                    }
                };
                reader.readAsText(file);
                importFile.value = '';
            });
        }

        function openApiModal(apiId) {
            const api = apiId ? data.apis.find(a => a.id === apiId) : null;
            const isEdit = !!api;
            editingApiId = apiId;

            modalBox.innerHTML = `
                <div class="modal-title">${isEdit ? '编辑 API' : '添加 API'}</div>
                <div class="form-group">
                    <label>名称</label>
                    <input id="apiName" value="${escHtml(api?.name || '')}" placeholder="如：OpenAI" />
                </div>
                <div class="form-group">
                    <label>URL</label>
                    <input id="apiUrl" value="${escHtml(api?.url || '')}" placeholder="https://api.openai.com/v1" />
                    <div class="text-muted" style="font-size:12px;margin-top:6px;">实际请求：<span id="apiUrlPreview" style="color:var(--accent);font-weight:500;">—</span></div>
                    <div class="text-muted" style="font-size:11px;margin-top:2px;">末尾加 # 可禁用自动补全</div>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input id="apiKey" type="password" value="${escHtml(api?.key || '')}" placeholder="sk-..." />
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <input id="apiModelManual" value="${escHtml(api?.model || '')}" placeholder="手动输入模型名（如 deepseek-chat）" style="margin-bottom:8px;" />
                    <button class="btn btn-sm btn-soft" id="fetchModelsBtn" style="width:100%;">拉取模型</button>
                    <div id="modelList" class="model-list mt-8"></div>
                    <div class="text-muted" style="font-size:12px;margin-top:6px;">点击 chip 或手动输入均可，保存时以手输为准</div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-soft" id="modalCancel">取消</button>
                    <button class="btn btn-primary" id="modalSave">${isEdit ? '保存' : '添加'}</button>
                </div>
            `;

            modalMask.classList.add('open');

            // URL 实时预览
            const urlInput = document.getElementById('apiUrl');
            const urlPreview = document.getElementById('apiUrlPreview');
            function updateUrlPreview() {
                const v = (urlInput.value || '').trim();
                if (!v) { urlPreview.textContent = '—'; return; }
                urlPreview.textContent = resolveChatUrl(v) || '—';
            }
            urlInput.addEventListener('input', updateUrlPreview);
            updateUrlPreview();

            // 拉取模型
            const fetchBtn = document.getElementById('fetchModelsBtn');
            const modelListDiv = document.getElementById('modelList');

            fetchBtn.addEventListener('click', async () => {
                const url = document.getElementById('apiUrl').value.trim();
                const key = document.getElementById('apiKey').value.trim();
                if (!url) { alert('请先填写 URL'); return; }
                if (!key) { alert('请先填写 API Key'); return; }
                fetchBtn.textContent = '拉取中…';
                fetchBtn.disabled = true;
                try {
                    const candidates = buildModelsCandidates(url);
                    let resp = null, lastErr = null;
                    for (const u of candidates) {
                        try {
                            const r = await fetch(u, { headers: { 'Authorization': 'Bearer ' + key } });
                            if (r.ok) { resp = r; break; }
                            lastErr = new Error('HTTP ' + r.status + ' @ ' + u);
                        } catch (err) { lastErr = err; }
                    }
                    if (!resp) throw (lastErr || new Error('拉取失败'));
                    const json = await resp.json();
                    const models = json.data || json.models || [];
                    if (!models.length) throw new Error('未找到模型列表');
                    modelListDiv.innerHTML = models.map(m => `
                        <div class="model-chip ${m.id === (api?.model || '') ? 'active' : ''}" data-model="${escHtml(m.id)}">${escHtml(m.id)}</div>
                    `).join('');
                    // 点击选择
                    modelListDiv.querySelectorAll('.model-chip').forEach(el => {
                        el.addEventListener('click', () => {

        // ============================================================

        function openChat(charId) {

        $('#chatBack').addEventListener('click', closeChat);

        // 聊天头部编辑按钮：打开当前角色编辑弹窗
        const chatEditBtn = document.getElementById('chatEditBtn');
        if (chatEditBtn) {
